[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pcb-cdso-api"
version = "0.6.0"
description = "PCB-CDSO expert-system API"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic==1.18.5",
  "celery[redis]==5.6.3",
  "fastapi==0.139.2",
  "pwdlib[argon2]==0.3.0",
  "pydantic-settings==2.14.2",
  "pymysql==1.2.0",
  "redis==6.4.0",
  "sqlalchemy==2.0.51",
  "uvicorn[standard]==0.51.0"
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "mypy==2.3.0",
  "pip-tools==7.6.0",
  "pytest==9.1.1",
  "ruff==0.15.22"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
filterwarnings = [
  "ignore:Using `httpx` with `starlette.testclient` is deprecated.*:starlette.exceptions.StarletteDeprecationWarning"
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["pcb_cdso"]
mypy_path = "src"
