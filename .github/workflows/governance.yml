name: Governance

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: governance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate governance baseline
        run: python scripts/quality/check_governance.py

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/requirements.lock
      - name: Install locked Python dependencies
        run: python -m pip install -r services/api/requirements.lock
      - name: Run governance tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

  pull-request-evidence:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Full history required: check_governance.py --acceptance-ready
          # validates that Candidate SHA exists in the repository via
          # git cat-file. Default fetch-depth: 1 only fetches the PR head,
          # causing historical candidate SHAs (e.g. M0 verified against
          # 3591987 while the acceptance record ships in a later PR) to
          # fail validation.
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate independent review and acceptance metadata
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python scripts/quality/check_pr_body.py --validate-acceptance-root .
