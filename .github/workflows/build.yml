name: Build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/requirements.lock
      - uses: actions/setup-node@v6
        with:
          node-version: "22.17.0"
          cache: npm
      - name: Install locked dependencies
        run: |
          python -m pip install -r services/api/requirements.lock
          npm ci
      - name: Run deterministic quality gate
        run: make verify

  compose-config:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Validate Compose contract
        run: python3 scripts/quality/verify_m0.py --check-config-only
