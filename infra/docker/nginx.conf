server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API endpoints to the FastAPI service. Vite dev server uses the
    # same prefix-less paths (see apps/web/vite.config.ts), so production
    # nginx must mirror them rather than only /api/.
    location ~ ^/(auth|projects|tasks|health)(/|$) {
        proxy_pass http://api:8000;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
